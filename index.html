<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="A$">
<meta name="theme-color" content="#F6F7F2">
<title>A$ — Finanzas</title>
<style>
:root{
  --bg:#F6F7F2; --bg2:#FFFFFF; --card:#FFFFFF; --card2:#EFF1E9; --card3:#E2E5D8;
  --line:rgba(24,28,16,.09); --line2:rgba(24,28,16,.17);
  --tx:#181C10; --tx2:#5A6050; --tx3:#8A907E;
  /* el lima solo sirve de relleno; para texto va la version oscura */
  --acc:#4A7000; --fill:#C8FF3D; --onFill:#141A06;
  --grn:#0F7A46; --red:#CE2F35; --org:#A85F00;
  --blu:#2563C4; --pur:#6D3FBF; --pnk:#B5326E; --cyn:#0B6E7D; --ylw:#8A6A00;
  --r:20px; --r2:14px; --r3:10px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --safeb:env(safe-area-inset-bottom,0px);
  --safet:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:15px;line-height:1.45;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em;}

/* ── modo oscuro: se activa con el atributo data-theme="oscuro" en la raiz ── */
:root[data-theme="oscuro"]{
  --bg:#08080A; --bg2:#0D0D10; --card:#141419; --card2:#1C1C23; --card3:#25252E;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.13);
  --tx:#F2F2F5; --tx2:#9A9AA4; --tx3:#5C5C66;
  --acc:#C8FF3D; --fill:#C8FF3D; --onFill:#0A0A0A;
  --grn:#3DDC97; --red:#FF5A5F; --org:#FFA83D;
  --blu:#5B9DFF; --pur:#B98CFF; --pnk:#FF6FA5; --cyn:#4FD6E8; --ylw:#FFD84D;
}
:root[data-theme="oscuro"] header{background:rgba(8,8,10,.82);}
:root[data-theme="oscuro"] nav{background:rgba(10,10,13,.9);}
:root[data-theme="oscuro"] #bd{background:rgba(0,0,0,.6);}
:root[data-theme="oscuro"] .hero{background:linear-gradient(160deg,#1A1F14 0%,var(--card) 55%);
  border-color:rgba(200,255,61,.16);}
:root[data-theme="oscuro"] .hero:after{background:radial-gradient(circle,rgba(200,255,61,.14),transparent 70%);}
:root[data-theme="oscuro"] .hero-chip{background:rgba(255,255,255,.045);}
:root[data-theme="oscuro"] .warn{background:rgba(255,168,61,.09);border-color:rgba(255,168,61,.2);}
:root[data-theme="oscuro"] .cat.on{background:rgba(200,255,61,.09);}
:root[data-theme="oscuro"] .card,
:root[data-theme="oscuro"] .tile,
:root[data-theme="oscuro"] .cc,
:root[data-theme="oscuro"] .menu{box-shadow:none;}
:root[data-theme="oscuro"] #fab{box-shadow:0 12px 30px rgba(200,255,61,.3);}
:root[data-theme="oscuro"] .mark{filter:drop-shadow(0 16px 40px rgba(200,255,61,.22));}
:root[data-theme="oscuro"] .amt input::placeholder{color:#25252E;}
:root[data-theme="oscuro"] #lock-in{background:var(--card);}

button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer;}
input,select{font-family:inherit;color:inherit;}
::-webkit-scrollbar{width:0;height:0;}

/* ══ LOCK ══ */
#lock{position:fixed;inset:0;z-index:900;background:var(--bg);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:28px;padding:24px;}
.mark{width:92px;height:92px;filter:drop-shadow(0 14px 30px rgba(74,112,0,.28));}
.mark svg{display:block;width:100%;height:100%;}
.mark-sm{width:26px;height:26px;flex:0 0 auto;}
.mark-sm svg{display:block;width:100%;height:100%;}
.lock-t{font-size:19px;font-weight:650;letter-spacing:-.3px;}
.lock-s{font-size:13px;color:var(--tx3);margin-top:2px;}
#lock-in{width:100%;max-width:260px;background:var(--bg2);border:1px solid var(--line);color:var(--tx);
  padding:16px;border-radius:var(--r2);font:600 17px/1 var(--mono);text-align:center;letter-spacing:.35em;outline:none;}
#lock-in:focus{border-color:var(--acc);}
#lock-btn{width:100%;max-width:260px;background:var(--fill);color:var(--onFill);padding:15px;border-radius:var(--r2);
  font-size:15px;font-weight:700;}
#lock-err{color:var(--red);font-size:13px;height:16px;}

/* ══ SHELL ══ */
#app{display:none;max-width:600px;margin:0 auto;min-height:100%;padding-bottom:calc(96px + var(--safeb));}
header{position:sticky;top:0;z-index:60;background:rgba(246,247,242,.86);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line);
  padding:calc(var(--safet) + 12px) 18px 12px;display:flex;align-items:center;gap:12px;min-height:56px;}
#hd-t{font-size:19px;font-weight:700;letter-spacing:-.4px;flex:1;}
.hd-b{width:36px;height:36px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;font-size:15px;}
.hd-b:active{background:var(--card2);}
main{padding:18px 18px 8px;}
.screen{display:none;animation:in .22s ease;}
.screen.on{display:block;}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ══ NAV ══ */
nav{position:fixed;bottom:0;left:0;right:0;z-index:70;background:rgba(255,255,255,.9);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(6px + var(--safeb));max-width:600px;margin:0 auto;}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 2px;
  color:var(--tx3);font-size:10px;font-weight:600;letter-spacing:.01em;transition:color .15s;}
nav button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;transition:.15s;}
nav button.on{color:var(--acc);}
nav button.on svg{stroke-width:2.1;transform:translateY(-1px);}
#fab{position:fixed;right:max(18px,calc(50vw - 282px));bottom:calc(78px + var(--safeb));z-index:75;
  width:56px;height:56px;border-radius:19px;background:var(--fill);color:var(--onFill);font-size:28px;font-weight:300;
  display:grid;place-items:center;box-shadow:0 10px 26px rgba(74,112,0,.28);transition:transform .15s;}
#fab:active{transform:scale(.92);}

/* ══ BLOCKS ══ */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(24,28,16,.045);}
.sec{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);
  margin:26px 2px 12px;display:flex;align-items:center;justify-content:space-between;}
.sec:first-child{margin-top:0;}
.sec button{font-size:11px;font-weight:700;color:var(--acc);letter-spacing:.02em;text-transform:none;}

.hero{background:linear-gradient(160deg,#EDF8D4 0%,var(--card) 58%);border:1px solid rgba(74,112,0,.20);
  border-radius:24px;padding:22px;position:relative;overflow:hidden;}
.hero:after{content:"";position:absolute;top:-60px;right:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(74,112,0,.10),transparent 70%);}
.hero-l{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--tx2);}
.hero-v{font-size:38px;font-weight:750;letter-spacing:-1.6px;margin:6px 0 2px;}
.hero-s{font-size:12.5px;color:var(--tx2);}
.hero-row{display:flex;gap:8px;margin-top:16px;position:relative;z-index:1;}
.hero-chip{flex:1;background:rgba(24,28,16,.035);border:1px solid var(--line);border-radius:var(--r3);padding:9px 10px;}
.hero-chip .l{font-size:9.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);}
.hero-chip .v{font-size:14px;font-weight:700;margin-top:2px;letter-spacing:-.3px;}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px;box-shadow:0 1px 2px rgba(24,28,16,.045);}
.tile .l{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);
  display:flex;align-items:center;gap:5px;}
.tile .v{font-size:20px;font-weight:700;margin-top:5px;letter-spacing:-.6px;}
.tile .s{font-size:11px;color:var(--tx3);margin-top:1px;}

.g{color:var(--grn)!important;} .r{color:var(--red)!important;} .a{color:var(--acc)!important;}
.b{color:var(--blu)!important;} .o{color:var(--org)!important;} .m{color:var(--tx2)!important;}

/* month picker */
.mp{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);
  border-radius:14px;padding:6px;margin-bottom:16px;}
.mp button{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--tx2);font-size:17px;}
.mp button:active{background:var(--card2);}
.mp .lbl{flex:1;text-align:center;font-size:14px;font-weight:650;letter-spacing:-.2px;text-transform:capitalize;}

/* donut */
.donut-wrap{display:flex;align-items:center;gap:18px;}
.donut{flex:0 0 128px;position:relative;}
.donut .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.donut .mid .v{font-size:16px;font-weight:750;letter-spacing:-.5px;}
.donut .mid .l{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);}
.leg{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0;}
.leg-i{display:flex;align-items:center;gap:8px;font-size:12.5px;}
.leg-d{width:8px;height:8px;border-radius:3px;flex:0 0 auto;}
.leg-n{flex:1;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.leg-v{font-weight:650;font-size:12px;}

/* bars */
.bars{display:flex;align-items:flex-end;gap:10px;height:132px;padding-top:6px;}
.bar-c{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;}
.bar-s{flex:1;display:flex;align-items:flex-end;gap:3px;width:100%;justify-content:center;}
.bar{width:11px;border-radius:4px 4px 2px 2px;min-height:3px;transition:height .4s cubic-bezier(.4,0,.2,1);}
.bar-l{font-size:9.5px;font-weight:700;color:var(--tx3);text-transform:uppercase;letter-spacing:.04em;}
.bar-c.now .bar-l{color:var(--acc);}

/* rows */
.list{display:flex;flex-direction:column;}
.row{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line);
  transition:background .12s;border-radius:10px;}
.row:last-child{border-bottom:none;}
.row:active{background:var(--card2);}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:0 0 auto;}
.row-m{flex:1;min-width:0;}
.row-t{font-size:14.5px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-s{font-size:11.5px;color:var(--tx3);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.row-v{font-size:14.5px;font-weight:700;letter-spacing:-.3px;text-align:right;flex:0 0 auto;}
.row-v .sub{font-size:10.5px;color:var(--tx3);font-weight:500;display:block;}
.day-h{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--tx3);
  padding:16px 2px 6px;display:flex;justify-content:space-between;}

/* card tiles */
.cc{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:0 1px 2px rgba(24,28,16,.045);}
.cc-top{display:flex;align-items:center;gap:12px;}
.cc-n{font-size:15px;font-weight:650;letter-spacing:-.2px;flex:1;}
.cc-b{font-size:16px;font-weight:750;letter-spacing:-.4px;}
.track{height:6px;background:var(--card3);border-radius:3px;overflow:hidden;margin:12px 0 7px;}
.fill{height:100%;border-radius:3px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.cc-f{display:flex;justify-content:space-between;font-size:11px;color:var(--tx3);font-weight:500;}

/* chips */
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 4px;margin:0 -18px 14px;padding-left:18px;padding-right:18px;}
.chip{flex:0 0 auto;padding:8px 14px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap;transition:.15s;}
.chip.on{background:var(--fill);border-color:var(--fill);color:var(--onFill);}
.chip:active{transform:scale(.96);}

/* menu */
.menu{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(24,28,16,.045);}
.mi{display:flex;align-items:center;gap:13px;padding:15px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left;}
.mi:last-child{border-bottom:none;}
.mi:active{background:var(--card2);}
.mi-i{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:15px;flex:0 0 auto;}
.mi-t{flex:1;font-size:14.5px;font-weight:600;letter-spacing:-.2px;}
.mi-v{font-size:13px;color:var(--tx3);font-weight:600;}
.mi-c{color:var(--tx3);font-size:16px;}

.empty{text-align:center;padding:44px 20px;color:var(--tx3);}
.empty .e{font-size:34px;margin-bottom:10px;opacity:.5;}
.empty .t{font-size:14px;font-weight:600;color:var(--tx2);}
.empty .s{font-size:12.5px;margin-top:3px;}

.srch{width:100%;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 14px;font-size:14.5px;outline:none;margin-bottom:12px;}
.srch:focus{border-color:var(--line2);}

/* ══ SHEET ══ */
#bd{position:fixed;inset:0;z-index:80;background:rgba(20,24,14,.34);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .25s;}
#bd.on{opacity:1;pointer-events:auto;}
#sh{position:fixed;left:0;right:0;bottom:0;z-index:85;background:var(--bg2);
  border-radius:26px 26px 0 0;border-top:1px solid var(--line2);max-width:600px;margin:0 auto;
  transform:translateY(101%);transition:transform .32s cubic-bezier(.32,.72,0,1);
  max-height:92vh;display:flex;flex-direction:column;}
#sh.on{transform:none;}
.sh-grab{padding:10px 0 2px;display:grid;place-items:center;flex:0 0 auto;}
.sh-grab i{width:36px;height:4px;border-radius:2px;background:var(--card3);display:block;}
.sh-h{display:flex;align-items:center;gap:12px;padding:8px 20px 14px;flex:0 0 auto;}
.sh-t{flex:1;font-size:17px;font-weight:700;letter-spacing:-.4px;}
.sh-x{width:30px;height:30px;border-radius:50%;background:var(--card2);display:grid;place-items:center;
  color:var(--tx2);font-size:15px;}
.sh-b{overflow-y:auto;padding:0 20px;-webkit-overflow-scrolling:touch;}
.sh-f{padding:14px 20px calc(20px + var(--safeb));flex:0 0 auto;border-top:1px solid var(--line);
  display:flex;gap:10px;background:var(--bg2);}

/* segmented */
.seg{display:flex;background:var(--card);border-radius:13px;padding:4px;gap:3px;margin-bottom:18px;}
.seg button{flex:1;padding:9px 3px;border-radius:10px;font-size:12.5px;font-weight:650;color:var(--tx3);
  transition:.18s;white-space:nowrap;}
.seg.cinco button{font-size:11px;padding:9px 2px;letter-spacing:-.2px;}
.seg button.on{background:var(--card3);color:var(--tx);}
.seg.mini button.on{background:var(--fill);color:var(--onFill);}

/* amount */
.amt{display:flex;align-items:baseline;justify-content:center;gap:3px;padding:14px 0 20px;}
.amt .cur{font-family:var(--mono);font-size:28px;font-weight:600;color:var(--tx3);letter-spacing:-1px;}
.amt input{background:none;border:none;outline:none;font-family:var(--mono);font-size:44px;font-weight:700;
  letter-spacing:-2px;text-align:left;width:3ch;max-width:72vw;color:var(--tx);padding:0;}
.amt input::placeholder{color:#C6CBBB;}

.f{margin-bottom:14px;}
.f label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
  color:var(--tx3);margin-bottom:7px;}
.f input,.f select,.f textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none;}
.f input:focus,.f select:focus{border-color:var(--acc);}
.f select{background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8'><path d='M1 1l5 5 5-5' stroke='%235A6050' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>");
  background-repeat:no-repeat;background-position:right 14px center;padding-right:38px;}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

.catg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px;}
.cat{padding:11px 4px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:4px;transition:.15s;}
.cat .e{font-size:18px;line-height:1;}
.cat .n{font-size:9.5px;font-weight:650;color:var(--tx3);letter-spacing:-.1px;}
.cat.on{border-color:var(--acc);background:rgba(74,112,0,.08);}
.cat.on .n{color:var(--acc);}
.cat:active{transform:scale(.95);}

.btn{flex:1;padding:15px;border-radius:14px;background:var(--fill);color:var(--onFill);font-size:15px;font-weight:700;
  letter-spacing:-.2px;transition:.15s;}
.btn:active{transform:scale(.98);opacity:.9;}
.btn.gh{background:var(--card2);color:var(--tx2);flex:0 0 auto;padding:15px 20px;}
.btn.dg{background:rgba(255,90,95,.13);color:var(--red);flex:0 0 auto;padding:15px 20px;}

.quick{display:flex;gap:7px;overflow-x:auto;margin:0 -20px 16px;padding:0 20px 4px;}
.qb{flex:0 0 auto;padding:8px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-size:12.5px;font-weight:600;color:var(--tx2);white-space:nowrap;display:flex;align-items:center;gap:5px;}
.qb:active{border-color:var(--acc);}

/* presupuesto semanal */
.wkb{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;margin-bottom:18px;}
.wkb-t{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;color:var(--tx3);}
.wkb-t .q{font-size:15px;font-weight:750;letter-spacing:-.3px;text-transform:none;}
.wkb-f{display:flex;justify-content:space-between;font-size:11.5px;color:var(--tx3);margin-top:6px;}
.wkb .track{margin:10px 0 0;}

.note{font-size:12px;color:var(--tx3);line-height:1.5;padding:2px 2px 16px;}
.warn{background:rgba(168,95,0,.07);border:1px solid rgba(168,95,0,.22);border-radius:var(--r2);
  padding:13px 15px;font-size:12.5px;color:var(--org);line-height:1.5;margin-bottom:14px;}

#toast{position:fixed;left:50%;bottom:calc(100px + var(--safeb));transform:translate(-50%,14px);z-index:200;
  background:var(--fill);color:var(--onFill);font-size:13.5px;font-weight:700;padding:11px 20px;border-radius:13px;
  opacity:0;pointer-events:none;transition:.25s;box-shadow:0 10px 28px rgba(24,28,16,.22);white-space:nowrap;}
#toast.on{opacity:1;transform:translate(-50%,0);}
</style>
<link rel="stylesheet" href="./modern.css">
<script src="./finance.js"></script>
</head>
<body>

<div id="lock">
  <div class="mark">
    <svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A$">
      <defs>
        <linearGradient id="mkg" x1="0" y1="0" x2=".55" y2="1">
          <stop offset="0" stop-color="#E6FF8F"/>
          <stop offset=".52" stop-color="#C8FF3D"/>
          <stop offset="1" stop-color="#9AD400"/>
        </linearGradient>
        <linearGradient id="mkh" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
          <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
        </linearGradient>
      </defs>

/* Lee montos escritos a la colombiana (29,86) y a la gringa (29.86).
   Regla: si hay dos separadores, el último manda. Si hay uno solo, es
   decimal cuando lo siguen 1 o 2 dígitos; si lo siguen 3, era de miles. */
function parseMonto(txt){
  var t=String(txt==null?"":txt).trim().replace(/\s/g,"").replace(/\$/g,"");
  if(!t) return NaN;
  var pto=t.lastIndexOf("."), com=t.lastIndexOf(",");
  if(pto>=0 && com>=0){
    var dec = pto>com ? "." : ",";
    var mil = dec==="." ? "," : ".";
    t = t.split(mil).join("");
    t = t.replace(dec,".");
  } else if(com>=0){
    var pc=t.split(",");
    t = (pc.length===2 && pc[1].length<=2) ? pc[0]+"."+pc[1] : pc.join("");
  } else if(pto>=0){
    var pp=t.split(".");
    if(!(pp.length===2 && pp[1].length<=2)) t=pp.join("");
  }
  return parseFloat(t);
}

function normalize(d){
  d.expenses=d.expenses||[]; d.income=d.income||[]; d.receivables=d.receivables||[];
  d.payables=d.payables||[]; d.cards=d.cards||[]; d.investments=d.investments||[];

  d.settings=Object.assign({fx:4100,rate:17,weekly:250,theme:'claro'},d.settings||{});

    c.promos.forEach(function(o){if(!o.id)o.id=uid();});

  // los "no-inversiones" (carro, liquidez) salen del portafolio
  var move=d.investments.filter(function(i){return i.type==="Vehículo"||i.type==="Liquidez";});
  if(move.length){
    d.investments=d.investments.filter(function(i){return i.type!=="Vehículo"&&i.type!=="Liquidez";});
    move.forEach(function(m){d.assets.push({id:uid(),name:m.name,type:m.type,value:m.currentValue,currency:m.currency});});
  }
  ["expenses","income","receivables","payables","cards","investments","assets","cafe_hours","prices","solana"].forEach(function(k){
    d[k].forEach(function(o){if(!o.id)o.id=uid();});
  });
  migrarCategorias(d);
  return d;
}

var storageOK=true, ultimoGuardado=null, ultimoError="";

  probar("escribir "+(tam/1024).toFixed(0)+" KB (tus datos)",function(){
    var t=new Array(tam).join("y");
    localStorage.setItem("__p2",t);
    var ok=localStorage.getItem("__p2").length===t.length;

/* ═══════════════ HELPERS ═══════════════ */
function fx(){return D.settings.fx||4100;}
function toUSD(a,c){return c==="COP"? a/fx() : a;}
function money(v,dec){
  var s=v<0?"-":"";
  return s+"$"+Math.abs(v).toLocaleString("en-US",{minimumFractionDigits:dec===0?0:2,maximumFractionDigits:dec===0?0:2});
}
function fmt(a,c){
  if(c==="COP") return (a<0?"-":"")+"$"+Math.round(Math.abs(a)).toLocaleString("es-CO");
  return money(a);
}
function kmoney(v){
  var a=Math.abs(v), s=v<0?"-":"";
  if(a>=10000) return s+"$"+(a/1000).toFixed(1).replace(/\.0$/,"")+"k";
  return money(v);
}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());}
function p2(n){return n<10?"0"+n:""+n;}
function monthOf(dt){return dt.slice(0,7);}
function monthLabel(m){var p=m.split("-");return MESES[+p[1]-1]+" "+p[0];}
function shiftMonth(m,n){
  var p=m.split("-"),y=+p[0],mo=+p[1]-1+n;
  y+=Math.floor(mo/12); mo=((mo%12)+12)%12;
  return y+"-"+p2(mo+1);
}
/* ── semana lunes→domingo ── */
function weekStart(){
  var d=new Date(today()+"T12:00:00"), n=(d.getDay()+6)%7;   // lunes = 0
  d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function diasRestantes(){
  var d=new Date(today()+"T12:00:00");
  return 7-((d.getDay()+6)%7);
}
function weekStartOf(ds){
  var d=new Date(ds+"T12:00:00"), n=(d.getDay()+6)%7;
  d.setDate(d.getDate()-n);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
// cuánto de este gasto le toca a la semana que empieza en ws.
// un gasto repartido en N semanas aporta amount/N a cada una.
function weekPortion(e,ws){
  var n=(e.spread>1)?e.spread:1;
  var dif=Math.round((Date.parse(weekStartOf(e.date)+"T12:00:00")*-1
          +Date.parse(ws+"T12:00:00"))/(7*86400000));
  if(dif<0||dif>=n) return 0;
  return toUSD(e.amount,e.currency)/n;
}
// Ninas es inversión, no gasto de la semana: no consume presupuesto
function weekSpent(){
  var ws=weekStart();
  return D.expenses.reduce(function(s,e){
    return Finance.area(e)!=="Personal"? s : s+weekPortion(e,ws);},0);
}
// gastos que siguen pesando en esta semana por venir repartidos
function repartidosActivos(){
  var ws=weekStart();
  return D.expenses.filter(function(e){
    return e.spread>1 && Finance.area(e)==="Personal" && weekPortion(e,ws)>0;});
}
function weekBox(extra,id){
  var b=D.settings.weekly||0;
  if(!b) return "";
  return '<div class="wkb" id="'+(id||"wkb")+'">'+weekInner(weekSpent(),b,extra||0)+'</div>';
}
function weekInner(gastado,b,extra){
  var tot=gastado+extra, q=b-tot, pct=b>0?Math.min(tot/b*100,100):0;
  var col=q<0?"var(--red)":(tot/b>.8?"var(--org)":"var(--grn)");
  var dias=diasRestantes();
  return '<div class="wkb-t"><span>Esta semana</span>'
    +'<span class="q num" style="color:'+col+'">'
    +(q>=0? money(q)+" libres" : "te pasaste "+money(-q))+'</span></div>'
    +'<div class="track"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div>'
    +'<div class="wkb-f"><span class="num">'+money(tot)+' de '+money(b)+'</span>'
    +'<span>'+(extra? "incluye este gasto"
      : (q>0? money(q/dias)+"/día · "+dias+(dias===1?" día":" días") : dias+(dias===1?" día":" días")))
    +'</span></div>';
}
function updWeek(){
  var box=el("wkb-live"); if(!box) return;

  var dt=el("f-date")?val("f-date"):today();
  var extra=isNaN(v)||area!=="Personal"||!dt?0:weekPortion({date:dt,amount:v,currency:_cur,spread:_spread},weekStart());
  box.innerHTML=weekInner(weekSpent(),b,extra);
}
function dayLabel(dt){
  var t=today();
  if(dt===t) return "Hoy";
  var y=new Date(); y.setDate(y.getDate()-1);
  if(dt===y.getFullYear()+"-"+p2(y.getMonth()+1)+"-"+p2(y.getDate())) return "Ayer";
  var p=dt.split("-");
  return +p[2]+" "+MS[+p[1]-1].toLowerCase()+" "+p[0];
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

/* ═══════════════ TOTALES ═══════════════ */
function sumUSD(arr,f){return arr.reduce(function(s,o){return s+toUSD(f?f(o):o.amount,o.currency);},0);}
function totals(){
  var inv=sumUSD(D.investments,function(i){return i.currentValue;});

  var ass=sumUSD(D.assets,function(a){return a.value;});
  var cob=sumUSD(D.receivables), pag=sumUSD(D.payables);
  var deu=sumUSD(D.cards,function(c){return c.balance;});
  return {inv:inv,invC:invC,ass:ass,cob:cob,pag:pag,deu:deu,
          nw:inv+ass+cob-deu-pag,
          inc:sumUSD(Finance.incomes(D)), exp:sumUSD(D.expenses)};
}
function monthData(m){
  var e=D.expenses.filter(function(x){return monthOf(x.date)===m;});
  var i=Finance.incomes(D).filter(function(x){return monthOf(x.date)===m;});
  return {exp:sumUSD(e),inc:sumUSD(i),e:e,i:i};
}

  D.expenses.forEach(function(x){s[monthOf(x.date)]=1;});
  Finance.incomes(D).forEach(function(x){s[monthOf(x.date)]=1;});

}
function saavaGastos(m){
  return D.expenses.filter(function(e){

}

/* ═══════════════ BOT SOLANA ═══════════════ */
// se registra el SALDO de la cuenta cada vez que lo revisas (no un delta a mano);
// la app calcula sola cuánto ganó o perdió comparando contra el registro anterior.
function solanaOrdenado(){
  // sort() es estable: si dos registros tienen la misma fecha, se respeta el orden
  // en que los guardaste (el ultimo que anotaste queda al final, no al azar).
  return D.solana.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
}
function solanaUltimo(){ var l=solanaOrdenado(); return l.length?l[l.length-1]:null; }
function solanaDeltas(){
  var l=solanaOrdenado(), out=[];
  for(var i=1;i<l.length;i++){
    out.push({entry:l[i],prev:l[i-1],
      delta:toUSD(l[i].balance,l[i].currency)-toUSD(l[i-1].balance,l[i-1].currency)});
  }
  return out;
}
function solanaCambioMes(m){
  var l=solanaOrdenado();
  var idxMes=[]; l.forEach(function(e,i){ if(monthOf(e.date)===m) idxMes.push(i); });
  if(!idxMes.length) return 0;
  var ultimoIx=idxMes[idxMes.length-1], baseIx=idxMes[0]>0?idxMes[0]-1:idxMes[0];
  return toUSD(l[ultimoIx].balance,l[ultimoIx].currency)-toUSD(l[baseIx].balance,l[baseIx].currency);
}
function sheetSolana(id){
  var e=id?D.solana.filter(function(x){return x.id===id;})[0]:null;
  sheet(e?"Editar registro":"Actualizar saldo del bot",
    '<div class="amt"><span class="cur">$</span><input id="f-sbal" inputmode="decimal" placeholder="0" '
    +'value="'+(e?e.balance:"")+'" oninput="fitAmt(this)"></div>'
    +fText("f-sdate","Fecha",e?e.date:today(),"","date")
    +fText("f-snote","Nota (opcional)",e?e.note:"","ej: 1.375 SOL, retiré ganancias…"),
    btns("guardarSolana("+(id?"'"+id+"'":"null")+")", id?"delRec('solana','"+id+"')":null));
  setTimeout(function(){var i=el("f-sbal"); if(i) fitAmt(i);},0);
}
function guardarSolana(id){
  var b=num("f-sbal"); if(b==null||b<0) return toast("Saldo inválido");
  var dt=val("f-sdate"), nota=val("f-snote");
  if(!dt) return toast("Falta la fecha");
  if(id){ var e=D.solana.filter(function(x){return x.id===id;})[0];
    e.balance=b; e.date=dt; e.note=nota; }
  else D.solana.push({id:uid(),date:dt,balance:b,currency:"USD",note:nota});
  save(); closeSheet(); refresh();
  toast("Saldo guardado ✓");
}
function rSolana(){
  var l=solanaOrdenado(), ultimo=solanaUltimo();
  var saldo=ultimo?toUSD(ultimo.balance,ultimo.currency):0;
  var deltas=solanaDeltas();
  var ultimoDelta=deltas.length?deltas[deltas.length-1]:null;
  var m=monthOf(today()), cambioMes=solanaCambioMes(m);
  var winRate=deltas.length?Math.round(deltas.filter(function(d){return d.delta>0;}).length/deltas.length*100):null;
  var mejor=deltas.length?deltas.reduce(function(a,b){return b.delta>a.delta?b:a;}):null;
  var peor=deltas.length?deltas.reduce(function(a,b){return b.delta<a.delta?b:a;}):null;
  var serie=l.map(function(e){return toUSD(e.balance,e.currency);});
  var tendenciaArriba = serie.length<2 || serie[serie.length-1]>=serie[0];

  el("s-solana").innerHTML=
    '<div class="hero" style="background:linear-gradient(160deg,'
     +(tendenciaArriba?T.heroPos:T.heroNeg)+' 0%,var(--card) 58%);border-color:'
     +(tendenciaArriba?T.bordePos:T.bordeNeg)+'">'
     +'<div class="hero-l">Bot Solana · saldo actual</div>'
     +'<div class="hero-v num">'+(ultimo?money(saldo):"—")+'</div>'
     +'<div class="hero-s">'
     +(!ultimo? "Sin registros todavía"
       : '<span class="'+(ultimoDelta?(ultimoDelta.delta>=0?"g":"r"):"m")+'">'
         +(ultimoDelta
           ? (ultimoDelta.delta>=0?"▲ +":"▼ ")+money(Math.abs(ultimoDelta.delta))+" desde "+dayLabel(ultimoDelta.prev.date)
           : "primer registro · "+dayLabel(ultimo.date))
         +'</span>')
     +'</div>'
     +'<div class="hero-row">'
      +'<div class="hero-chip"><div class="l">Este mes</div><div class="v num '+(cambioMes>=0?"g":"r")+'">'
      +(cambioMes>=0?"+":"")+kmoney(cambioMes)+'</div></div>'
      +'<div class="hero-chip"><div class="l">Días en verde</div><div class="v num">'
      +(winRate==null?"—":winRate+"%")+'</div></div>'
      +'<div class="hero-chip"><div class="l">Registros</div><div class="v num">'+l.length+'</div></div>'
     +'</div></div>'

    +'<button class="btn" style="width:100%;margin-top:16px" onclick="sheetSolana()">+ Actualizar saldo</button>'

    +(serie.length>1?'<div class="sec">Evolución</div><div class="card" style="padding:16px 16px 8px">'
      +areaChart(serie,tendenciaArriba?T.grn:T.red)+'</div>':"")

    +(mejor&&peor&&deltas.length>1?'<div class="grid2" style="margin-top:14px">'
      +'<div class="tile"><div class="l">Mejor cambio</div><div class="v num g">+'+money(mejor.delta)
      +'</div><div class="s">'+dayLabel(mejor.entry.date)+'</div></div>'
      +'<div class="tile"><div class="l">Peor cambio</div><div class="v num r">'+money(peor.delta)
      +'</div><div class="s">'+dayLabel(peor.entry.date)+'</div></div>'
     +'</div>':"")

    +'<div class="sec">Historial</div>'
    +'<div class="card" style="padding:6px 14px">'
    +(l.length?'<div class="list">'+l.slice().reverse().map(function(e){
       var d=deltas.filter(function(x){return x.entry.id===e.id;})[0];
       return '<div class="row" onclick="sheetSolana(\''+e.id+'\')">'
        +'<div class="ico" style="background:'+(d?(d.delta>=0?T.grn:T.red):T.cyn)+'1f">'
        +(d?(d.delta>=0?"📈":"📉"):"🪙")+'</div>'
        +'<div class="row-m"><div class="row-t">'+dayLabel(e.date)+'</div>'
        +'<div class="row-s">'+(e.note?esc(e.note):(d?"vs. "+dayLabel(d.prev.date):"primer registro"))+'</div></div>'
        +'<div class="row-v num">'+money(toUSD(e.balance,e.currency))
        +(d?'<span class="sub" style="color:'+(d.delta>=0?"var(--grn)":"var(--red)")+'">'
           +(d.delta>=0?"+":"")+money(d.delta)+'</span>':'')
        +'</div></div>';
     }).join("")+'</div>'
     :'<div class="empty"><div class="e">🪙</div><div class="t">Sin registros</div>'
      +'<div class="s">Anota el saldo de hoy</div></div>')
    +'</div>'
    +'<div class="note">Registro manual — esta app no se conecta a tu bot en el VPS. '
    +'No cuenta como gasto ni ingreso personal en el resto de la app.</div>';
}

/* ═══════════════ SUSCRIPCIONES ═══════════════ */
function subsAgrupadas(){
  var g={};
  D.expenses.filter(function(e){return e.category==="Suscripciones";}).forEach(function(e){
    var k=norm(e.desc);
    g[k]=g[k]||{nombre:e.desc,n:0,total:0,ultima:"",montos:[]};
    g[k].n++; g[k].total+=toUSD(e.amount,e.currency);
    g[k].montos.push(toUSD(e.amount,e.currency));
    if(e.date>g[k].ultima){g[k].ultima=e.date; g[k].nombre=e.desc;}
  });
  return Object.keys(g).map(function(k){
    var o=g[k];
    o.prom=o.total/o.n;
    o.dias=Math.round((Date.parse(today())-Date.parse(o.ultima))/86400000);
    return o;
  }).sort(function(a,b){return b.prom-a.prom;});
}
function consejosSubs(subs){
  var c=[], mensual=subs.reduce(function(s,o){return s+o.prom;},0);
  // contra el ingreso mensual promedio, no contra el mes en curso que va a medias
  var mesesConIngreso={};
  D.income.forEach(function(i){
    var m=monthOf(i.date);
    mesesConIngreso[m]=(mesesConIngreso[m]||0)+toUSD(i.amount,i.currency);});
  var ms=Object.keys(mesesConIngreso);
  var ingMes=ms.length? ms.reduce(function(a,k){return a+mesesConIngreso[k];},0)/ms.length : 0;
  var dormidas=subs.filter(function(o){return o.dias>45;});
  if(dormidas.length)
    c.push({t:"warn",m:"No registras "+dormidas.map(function(o){return o.nombre;}).join(", ")
      +" hace más de 45 días. Si el cobro sigue activo y no la estás usando, cancélala; "
      +"si la usas, te falta registrar el cargo."});
  var caras=subs.filter(function(o){return o.prom>=20;});
  if(caras.length)
    c.push({t:"info",m:caras[0].nombre+" es tu suscripción más cara ("+money(caras[0].prom)
      +"/mes, "+money(caras[0].prom*12)+" al año). Revisa si el plan que tienes es el que necesitas."});
  var ia=subs.filter(function(o){return /claude|anthropic|deepseek|eleven|opus|chatgpt|openai/i.test(o.nombre);});
  if(ia.length>2)
    c.push({t:"warn",m:"Tienes "+ia.length+" suscripciones de IA a la vez ("
      +money(ia.reduce(function(s,o){return s+o.prom;},0))+"/mes). Casi siempre una buena reemplaza a dos."});
  if(mensual>0)
    c.push({t:"info",m:"Entre todas te cuestan "+money(mensual)+" al mes, "+money(mensual*12)
      +" al año"+(ingMes>0?" — el "+(mensual/ingMes*100).toFixed(1)
        +"% de tu ingreso mensual promedio ("+money(ingMes)+")":"")+"."});
  if(!subs.length) c.push({t:"info",m:"No tienes suscripciones registradas."});
  return c;
}
function rSubs(){
  var subs=subsAgrupadas(), mensual=subs.reduce(function(s,o){return s+o.prom;},0);
  el("s-subs").innerHTML=
    '<div class="grid2" style="margin-bottom:18px">'
     +'<div class="tile"><div class="l">Al mes</div><div class="v num o">'+money(mensual)+'</div>'
     +'<div class="s">'+subs.length+' activas</div></div>'
     +'<div class="tile"><div class="l">Al año</div><div class="v num r">'+money(mensual*12)+'</div></div>'
    +'</div>'
    +'<div class="sec">Consejos</div>'
    +consejosSubs(subs).map(function(o){
      return '<div class="'+(o.t==="warn"?"warn":"card")+'" style="margin-bottom:10px;'
        +(o.t==="warn"?"":"font-size:12.5px;color:var(--tx2);line-height:1.5;padding:13px 15px")+'">'
        +(o.t==="warn"?"⚠ ":"")+o.m+'</div>';}).join("")
    +'<div class="sec">Detalle</div>'
    +'<div class="card" style="padding:6px 14px">'
    +(subs.length?'<div class="list">'+subs.map(function(o){
      return '<div class="row">'
       +'<div class="ico" style="background:#8A6A001f">🔁</div>'
       +'<div class="row-m"><div class="row-t">'+esc(o.nombre)+'</div>'
       +'<div class="row-s">'+o.n+' cobro'+(o.n===1?"":"s")+' · último '+dayLabel(o.ultima)
       +(o.dias>45?" · dormida":"")+'</div></div>'
       +'<div class="row-v num">'+money(o.prom)+'<span class="sub">'+money(o.prom*12)+'/año</span></div>'
       +'</div>';}).join("")+'</div>'
     :'<div class="empty"><div class="e">🔁</div><div class="t">Sin suscripciones</div></div>')
    +'</div>';

/* ═══════════════ TRABAJO ═══════════════ */
function tarifa(){return D.settings.rate||0;}
// Ninas y Saava son inversion / costo de negocio: no cuentan como gasto personal
function esInversion(cat){return cat==="Ninas"||cat==="Saava"||cat==="Sequo";}
function esPropina(src){return /tip|propina/i.test(src||"");}
function propinasDia(ds){
  return D.income.filter(function(i){return i.date===ds && esPropina(i.source);})
    .reduce(function(s,i){return s+toUSD(i.amount,i.currency);},0);
}
function propinasSemana(w){
  return D.income.filter(function(i){return esPropina(i.source) && weekStartOf(i.date)===w;})
    .reduce(function(s,i){return s+toUSD(i.amount,i.currency);},0);
}
function propinasMes(m){
  return D.income.filter(function(i){return esPropina(i.source) && monthOf(i.date)===m;})
    .reduce(function(s,i){return s+toUSD(i.amount,i.currency);},0);
}
function gastoDia(ds){
  return D.expenses.filter(function(e){return e.date===ds && Finance.area(e)==="Personal";})
    .reduce(function(s,e){return s+toUSD(e.amount,e.currency);},0);
}
function horasDia(ds){
  return D.cafe_hours.filter(function(h){return h.date===ds;})
    .reduce(function(s,h){return s+h.hours;},0);
}
function filaBalance(etiqueta,sub,gan,gas){
  var neto=gan-gas;
  return '<div class="row" style="align-items:center">'
   +'<div class="row-m"><div class="row-t">'+etiqueta+'</div>'
   +'<div class="row-s">'+sub+'</div></div>'
   +'<div class="row-v num" style="color:'+(neto>=0?"var(--grn)":"var(--red)")+'">'
   +(neto>=0?"+":"")+money(neto)
   +'<span class="sub">'+money(gan)+' &minus; '+money(gas)+'</span></div></div>';
}
function rTrabajo(){
  var m=monthOf(today()), r=tarifa();
  var hs=D.cafe_hours.filter(function(h){return monthOf(h.date)===m;});
  var horasMes=hs.reduce(function(s,h){return s+h.hours;},0);
  var salMes=horasMes*r, tipsMes=propinasMes(m), ganMes=salMes+tipsMes;
  var gasMes=D.expenses.filter(function(e){return monthOf(e.date)===m && Finance.area(e)==="Personal";})
    .reduce(function(s,e){return s+toUSD(e.amount,e.currency);},0);
  var netoMes=ganMes-gasMes;

  var sem={};
  hs.forEach(function(h){var w=weekStartOf(h.date); sem[w]=sem[w]||{h:0,g:0}; sem[w].h+=h.hours;});
  D.expenses.forEach(function(e){
    if(monthOf(e.date)!==m || Finance.area(e)!=="Personal") return;
    var w=weekStartOf(e.date); sem[w]=sem[w]||{h:0,g:0};
    sem[w].g+=toUSD(e.amount,e.currency);
  });
  D.income.forEach(function(i){
    if(monthOf(i.date)!==m || !esPropina(i.source)) return;
    var w=weekStartOf(i.date); sem[w]=sem[w]||{h:0,g:0};
  });
  var semanas=Object.keys(sem).sort().reverse();

  var dias={};
  hs.forEach(function(h){dias[h.date]=1;});
  D.expenses.forEach(function(e){if(monthOf(e.date)===m && Finance.area(e)==="Personal") dias[e.date]=1;});
  D.income.forEach(function(i){if(monthOf(i.date)===m && esPropina(i.source)) dias[i.date]=1;});
  var ds=Object.keys(dias).sort().reverse();

  el("s-trabajo").innerHTML=
    '<div class="hero" style="background:linear-gradient(160deg,'
     +(netoMes>=0?T.heroPos:T.heroNeg)+' 0%,var(--card) 58%);border-color:'
     +(netoMes>=0?T.bordePos:T.bordeNeg)+'">'
     +'<div class="hero-l">Balance estimado de '+monthLabel(m)+'</div>'
     +'<div class="hero-v num '+(netoMes>=0?"g":"r")+'">'+(netoMes>=0?"+":"")+money(netoMes)+'</div>'
     +'<div class="hero-s">'+horasMes+'h a '+money(r)+'/hora, más propinas</div>'
     +'<div class="hero-row">'
      +'<div class="hero-chip"><div class="l">Salario</div><div class="v num g">'+kmoney(salMes)+'</div></div>'
      +'<div class="hero-chip"><div class="l">Propinas</div><div class="v num g">'+kmoney(tipsMes)+'</div></div>'
      +'<div class="hero-chip"><div class="l">Gastado</div><div class="v num r">'+kmoney(gasMes)+'</div></div>'
     +'</div></div>'
    +(tipsMes>0? '<div class="note" style="padding-top:12px">Las propinas salen de tus ingresos '
      +'cuya fuente diga “tips” o “propina”. Este mes: '+money(tipsMes)
      +' ('+(ganMes>0?(tipsMes/ganMes*100).toFixed(0):0)+'% de lo que ganaste).</div>' : "")

    +'<div class="note" style="margin-top:12px">Esta vista estima lo ganado usando la tarifa actual. Las horas también se suman a Personal y a los balances. No vuelvas a registrar como ingreso el pago correspondiente a estas horas.</div>'+planningLinks()
    +'<div class="sec">Tarifa y turnos<button onclick="editHora()">+ Turno</button></div>'
    +'<div class="f"><label>Cuanto te pagan por hora (USD)</label>'
    +'<input id="f-rate" inputmode="decimal" value="'+r+'" onchange="guardarTarifa()"></div>'

    +'<div class="sec">Por semana</div>'
    +'<div class="card" style="padding:6px 14px">'
    +(semanas.length?'<div class="list">'+semanas.map(function(w){
       var o=sem[w], tips=propinasSemana(w), gan=o.h*r+tips;
       var fin=new Date(Date.parse(w+"T12:00:00")+6*86400000);
       var etiq=dayLabel(w).replace(/ \d{4}$/,"")+" a "+fin.getDate()+" "+MS[fin.getMonth()].toLowerCase();
       return filaBalance(etiq,o.h+"h"+(tips>0?" · "+money(tips)+" en propinas":""),gan,o.g);
     }).join("")+'</div>'
     :'<div class="empty"><div class="e">📅</div><div class="t">Sin datos este mes</div></div>')
    +'</div>'

    +'<div class="sec">Por día</div>'
    +'<div class="card scrollable" style="padding:6px 14px">'
    +(ds.length?'<div class="list">'+ds.map(function(d){
       var h=horasDia(d), tips=propinasDia(d);
       var sub = h? h+"h" : "sin turno";
       if(tips>0) sub+=" · "+money(tips)+" en propinas";
       return filaBalance(dayLabel(d), sub, h*r+tips, gastoDia(d));
     }).join("")+'</div>'
     :'<div class="empty"><div class="e">📅</div><div class="t">Sin datos</div></div>')
    +'</div>'

    +'<div class="sec">Turnos registrados</div>'
    +'<div class="card scrollable" style="padding:6px 14px">'
    +(D.cafe_hours.length?'<div class="list">'+D.cafe_hours.slice()
       .sort(function(a,b){return b.date.localeCompare(a.date);}).map(function(h){
       return '<div class="row" onclick="editHora(\''+h.id+'\')">'
        +'<div class="ico" style="background:'+T.lima+'1f">☕</div>'
        +'<div class="row-m"><div class="row-t">'+dayLabel(h.date)+'</div>'
        +'<div class="row-s">'+esc(h.shift)+'</div></div>'
        +'<div class="row-v num">'+h.hours+'h<span class="sub">'+money(h.hours*r)+'</span></div></div>';
     }).join("")+'</div>'
     :'<div class="empty"><div class="e">☕</div><div class="t">Sin turnos</div></div>')
    +'</div>'
    +'<div class="note">El gasto incluye únicamente movimientos del área Personal.</div>';
}
function guardarTarifa(){
  var v=parseMonto(el("f-rate").value);
  if(isNaN(v)||v<0) return toast("Tarifa invalida");
  D.settings.rate=v; save(); refresh(); toast("Tarifa guardada ✓");
}

function detectarCat(desc){
  var d=norm(desc);
  if(!d) return null;
  for(var i=0;i<REGLAS.length;i++){
    var ks=REGLAS[i][1];
    for(var j=0;j<ks.length;j++) if(d.indexOf(ks[j])>=0) return REGLAS[i][0];
  }
  return null;
}
// migra los "Alimentación" viejos a Mercado o Restaurante
function migrarCategorias(d){
  var mapa={"Alimentación":1,"Alimentacion":1};
  d.expenses.forEach(function(e){
    if(mapa[e.category]){
      var c=detectarCat(e.desc);
      e.category=(c==="Mercado")?"Mercado":"Restaurante";
    }
  });
  if(d.settings&&d.settings.budgets&&d.settings.budgets["Alimentación"]!=null){
    var v=d.settings.budgets["Alimentación"];
    delete d.settings.budgets["Alimentación"];
    if(d.settings.budgets["Restaurante"]==null) d.settings.budgets["Restaurante"]=v;
  }
}

function temaEfectivo(t){
  if(t==="auto") return (window.matchMedia &&
    window.matchMedia("(prefers-color-scheme: dark)").matches) ? "oscuro" : "claro";
  return t==="oscuro" ? "oscuro" : "claro";
}

  D.settings.theme=t;
  var ef=temaEfectivo(t);
  T=PALETAS[ef];
  document.documentElement.setAttribute("data-theme",ef);
  CATS["Transporte"].c=T.blu; CATS["Ocio"].c=T.pur;
  CATS["Servicios"].c=T.cyn;    CATS["Suscripciones"].c=T.ylw; CATS["Salud"].c=T.grn;
  CATS["Vivienda"].c=T.pnk;     CATS["Otros"].c=T.gris;        CATS["Ninas"].c=T.lima; CATS["Saava"].c=T.ind; CATS["Sequo"].c=T.seq;

  PAL=[T.lima,T.blu,T.pnk,T.grn,T.org,T.pur,T.cyn,T.ylw];
  if(rerender){ save(); refresh(); }
}

/* ═══════════════ BALANCE SEMANAL ═══════════════ */
function semanaFin(ini){
  var d=new Date(Date.parse(ini+"T12:00:00")+6*86400000);
  return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate());
}
function etiquetaSemana(ini){
  var f=semanaFin(ini), a=ini.split("-"), b=f.split("-");
  return (+a[2])+" "+MS[+a[1]-1].toLowerCase()+" a "+(+b[2])+" "+MS[+b[1]-1].toLowerCase();
}
// Ninas es inversion, no consumo: no entra en el balance de la semana
function semanas(){
  var keys={}; keys[weekStart()]=1;
  D.expenses.concat(D.income,D.cafe_hours).forEach(function(o){keys[Finance.monday(o.date)]=1;});
  return Object.keys(keys).sort().reverse().map(function(k){
    var w=Finance.weekly(D,k),saava=Finance.weekly(D,k,"Saava");
    return {ini:k,inc:w.received,exp:w.spent,h:w.hours,tips:w.tips,neto:w.net,
      saavaInc:saava.received,saavaExp:saava.spent};
  });
}

/* ═══════════════ PRESUPUESTO ═══════════════ */
function gastoMesCat(cat,m){
  return D.expenses.filter(function(e){
    return e.category===cat && monthOf(e.date)===(m||monthOf(today()));
  }).reduce(function(s,e){return s+toUSD(e.amount,e.currency);},0);
}
function presupuestoTotal(){
  var b=D.settings.budgets, t=0;
  Object.keys(b).forEach(function(k){t+=b[k]||0;});
  return t;
}
function rPresupuesto(){
  var m=monthOf(today()), b=D.settings.budgets;
  var conTope=Object.keys(CATS).filter(function(k){return b[k]>0;});
  var totB=presupuestoTotal();
  var totG=conTope.reduce(function(s,k){return s+gastoMesCat(k,m);},0);
  var libre=totB-totG;

  el("s-presupuesto").innerHTML=
    '<div class="hero" style="background:linear-gradient(160deg,'+(libre>=0?T.heroPos:T.heroNeg)
     +' 0%,var(--card) 55%);border-color:'+(libre>=0?T.bordePos:T.bordeNeg)+'">'
     +'<div class="hero-l">Te queda este mes</div>'
     +'<div class="hero-v num '+(libre>=0?"g":"r")+'">'+money(libre)+'</div>'
     +'<div class="hero-s">'+money(totG)+' de '+money(totB)+' · '+monthLabel(m)+'</div></div>'

    +'<div class="sec">Semanal general</div>'
    +weekBox()
    +(repartidosActivos().length? '<div class="note" style="padding-top:0">'
       +repartidosActivos().map(function(e){
          return esc(e.desc)+" (repartido en "+e.spread+" semanas, "
            +money(toUSD(e.amount,e.currency)/e.spread)+"/sem)";}).join("<br>")
       +'</div>' : "")

    +'<div class="sec">Tope mensual por categoría</div>'
    +'<div class="card" style="padding:16px">'
    +Object.keys(CATS).map(function(k){
      var tope=b[k]||0, g=gastoMesCat(k,m);
      var pct=tope>0?Math.min(g/tope*100,100):0;
      var col=tope<=0?"var(--card3)":(g>tope?"var(--red)":(g/tope>.8?"var(--org)":"var(--grn)"));
      return '<div style="margin-bottom:16px" onclick="sheetTope(\''+k+'\')">'
        +'<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">'
         +'<span style="font-size:14px">'+CATS[k].e+'</span>'
         +'<span style="flex:1;font-size:13.5px;font-weight:600">'+esc(k)+'</span>'
         +'<span class="num" style="font-size:12.5px;color:'+(tope>0?"var(--tx)":"var(--tx3)")+'">'
         +(tope>0? money(g)+" / "+money(tope) : "sin tope")+'</span></div>'
        +'<div class="track"><div class="fill" style="width:'+pct+'%;background:'+col+'"></div></div>'
        +(tope>0? '<div style="font-size:11px;color:'+col+';margin-top:5px;text-align:right" class="num">'
           +(g>tope? "te pasaste "+money(g-tope) : "quedan "+money(tope-g))+'</div>' : '')
        +'</div>';}).join("")
    +'</div>'
    +'<div class="note">Toca una categoría para ponerle o quitarle tope. '
    +'Solo las que tienen tope cuentan en el total de arriba.</div>';
}
function sheetTope(cat){
  var b=D.settings.budgets;
  sheet("Tope de "+cat,
    '<div class="f"><label>Máximo al mes (USD)</label>'
    +'<input id="f-tope" inputmode="decimal" value="'+(b[cat]||"")+'" placeholder="0"></div>'
    +'<div class="note">Gastado en '+monthLabel(monthOf(today()))+': '
    +money(gastoMesCat(cat))+'. Déjalo en 0 o vacío para quitar el tope.</div>',
    '<button class="btn" onclick="guardarTope(\''+cat+'\')">Guardar</button>');
}
function guardarTope(cat){
  var v=num("f-tope");
  if(!v||v<=0) delete D.settings.budgets[cat];
  else D.settings.budgets[cat]=v;
  save(); closeSheet(); refresh(); toast("Tope guardado ✓");
}

/* ═══════════════ PRECIOS ═══════════════ */
function ultimo(pr){return pr.history.length?pr.history[pr.history.length-1]:null;}
function previo(pr){return pr.history.length>1?pr.history[pr.history.length-2]:null;}
function cambio(pr){
  var u=ultimo(pr), a=previo(pr);
  if(!u||!a||!a.p) return null;
  return {abs:u.p-a.p, pct:(u.p-a.p)/a.p*100};
}
function fmtPrecio(pr,v){
  if(v==null) return "—";
  if(pr.unit==="COP") return "$"+Math.round(v).toLocaleString("es-CO");
  return "$"+v.toLocaleString("en-US",
    {minimumFractionDigits:v<10?4:2, maximumFractionDigits:v<10?4:2});
}
// registra el precio del día (si ya hay uno de hoy, lo reemplaza)
function setPrecio(pr,v,fecha){
  var d=fecha||today();
  var ya=pr.history.filter(function(h){return h.d===d;})[0];
  if(ya) ya.p=v; else pr.history.push({d:d,p:v});
  pr.history.sort(function(a,b){return a.d.localeCompare(b.d);});
  if(pr.unit==="COP" && /d[oó]lar|TRM|USD/i.test(pr.label)) D.settings.fx=v;
  // si hay cantidad registrada, el valor de la posición se recalcula solo
  D.investments.forEach(function(i){
    if(i.qty>0 && norm(i.name)===norm(pr.label)) i.currentValue=i.qty*v;
  });
}
function rPrecios(){
  var hoy=today();
  el("s-precios").innerHTML=
    '<div class="note" style="padding-bottom:14px">Los precios se registran a mano: '
    +'esta app no puede consultar el mercado. Toca “Actualizar” y anota los de hoy.</div>'
    +'<button class="btn" style="width:100%;margin-bottom:20px" onclick="sheetPrecios()">Actualizar precios</button>'
    +(D.prices.length? D.prices.map(function(pr){
      var u=ultimo(pr), c=cambio(pr);
      var col=!c?"var(--tx3)":(c.abs>=0?"var(--grn)":"var(--red)");
      var viejo=u&&u.d!==hoy;
      var serie=pr.history.slice(-12).map(function(h){return h.p;});
      var min=Math.min.apply(null,serie);
      return '<div class="card" style="margin-bottom:10px;padding:15px 16px" onclick="sheetPrecio(\''+pr.id+'\')">'
       +'<div style="display:flex;align-items:baseline;gap:10px">'
        +'<div style="flex:1"><div style="font-size:15px;font-weight:650;letter-spacing:-.2px">'+esc(pr.label)+'</div>'
        +'<div style="font-size:11px;color:'+(viejo?"var(--org)":"var(--tx3)")+'">'
        +(u? (viejo?"desde "+dayLabel(u.d):"actualizado hoy") : "sin precio")+'</div></div>'
        +'<div style="text-align:right"><div class="num" style="font-size:17px;font-weight:750;letter-spacing:-.4px">'
        +fmtPrecio(pr,u?u.p:null)+'</div>'
        +'<div class="num" style="font-size:11.5px;font-weight:650;color:'+col+'">'
        +(c? (c.abs>=0?"▲ +":"▼ ")+fmtPrecio(pr,Math.abs(c.abs))+" ("+c.pct.toFixed(2)+"%)" : "sin histórico")
        +'</div></div>'
       +'</div>'
       +(serie.length>2? '<div style="margin:8px -4px -6px">'
          +areaChart(serie.map(function(v){return v-min*0.98;}),c&&c.abs<0?T.red:T.grn)+'</div>' : "")
      +'</div>';}).join("")
     : '<div class="empty"><div class="e">📉</div><div class="t">Sin instrumentos</div></div>')
    +'<div class="note" style="margin-top:8px">El dólar actualiza la tasa de conversión de toda la app. '
    +'Si le pones cantidad a una posición en Portafolio, su valor se recalcula solo al cambiar el precio.</div>';
}
function sheetPrecios(){
  sheet("Precios de hoy",
    D.prices.map(function(pr,ix){
      var u=ultimo(pr);
      return '<div class="f"><label>'+esc(pr.label)
        +(u?' · último '+fmtPrecio(pr,u.p):'')+'</label>'
        +'<input id="px-'+ix+'" inputmode="decimal" placeholder="'+(u?u.p:"0")+'"></div>';
    }).join("")
    +'<div class="note">Deja en blanco lo que no quieras cambiar.</div>',
    '<button class="btn" onclick="guardarPrecios()">Guardar</button>');
}
function guardarPrecios(){
  var n=0;
  D.prices.forEach(function(pr,ix){
    var v=parseMonto(el("px-"+ix).value);
    if(!isNaN(v)&&v>0){ setPrecio(pr,v); n++; }
  });
  if(!n) return toast("No pusiste ningún precio");
  save(); closeSheet(); refresh(); toast(n+(n===1?" precio":" precios")+" actualizados ✓");
}
function sheetPrecio(id){
  var pr=D.prices.filter(function(x){return x.id===id;})[0]; if(!pr) return;
  var u=ultimo(pr);
  sheet(pr.label,

function guardarPrecio(id){
  var pr=D.prices.filter(function(x){return x.id===id;})[0];
  var v=parseMonto(el("f-px").value);
  if(isNaN(v)||v<=0) return toast("Precio inválido");

  save(); closeSheet(); refresh(); toast("Precio guardado ✓");
}
function borrarPrecio(id){
  if(!confirm("¿Quitar este instrumento y todo su historial?")) return;
  D.prices=D.prices.filter(function(x){return x.id!==id;});
  save(); closeSheet(); refresh(); toast("Eliminado");
}

/* ═══════════════ CHARTS ═══════════════ */
function donut(items,total){
  var R=54,C=2*Math.PI*R,off=0,segs="";
  items.forEach(function(it){
    var frac=total>0?it.v/total:0, len=frac*C;
    segs+='<circle cx="64" cy="64" r="'+R+'" fill="none" stroke="'+it.c+'" stroke-width="17"'
        +' stroke-dasharray="'+(len-2>0?len-2:0)+' '+(C-len+2)+'" stroke-dashoffset="'+(-off)+'"'
        +' stroke-linecap="round" transform="rotate(-90 64 64)"/>';
    off+=len;
  });
  return '<svg width="128" height="128" viewBox="0 0 128 128">'
    +'<circle cx="64" cy="64" r="'+R+'" fill="none" stroke=T.track stroke-width="17"/>'+segs+'</svg>';
}
function ring(pct,color){
  var R=17,C=2*Math.PI*R,len=Math.min(pct,100)/100*C;
  return '<svg width="42" height="42" viewBox="0 0 42 42">'
    +'<circle cx="21" cy="21" r="'+R+'" fill="none" stroke=T.track stroke-width="4"/>'
    +'<circle cx="21" cy="21" r="'+R+'" fill="none" stroke="'+color+'" stroke-width="4" stroke-linecap="round"'
    +' stroke-dasharray="'+len+' '+(C-len)+'" transform="rotate(-90 21 21)"/>'
    +'<text x="21" y="24.5" text-anchor="middle" font-size="10" font-weight="700" fill="'+color+'" '
    +'font-family="ui-monospace,monospace">'+Math.round(pct)+'</text></svg>';
}
function areaChart(vals,color){
  if(!vals.length) return "";
  var W=100,H=42,max=Math.max.apply(null,vals)||1;
  var pts=vals.map(function(v,i){
    var x=vals.length>1? i/(vals.length-1)*W : 0;
    return x.toFixed(2)+","+(H-v/max*(H-4)).toFixed(2);
  });
  return '<svg viewBox="0 0 100 42" preserveAspectRatio="none" style="width:100%;height:52px;display:block">'
    +'<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1">'
    +'<stop offset="0" stop-color="'+color+'" stop-opacity=".35"/>'
    +'<stop offset="1" stop-color="'+color+'" stop-opacity="0"/></linearGradient></defs>'
    +'<path d="M0,'+H+' L'+pts.join(" L")+' L'+W+','+H+' Z" fill="url(#ag)"/>'
    +'<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+color+'" stroke-width="1.6"'
    +' vector-effect="non-scaling-stroke" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

/* ═══════════════ EXPORT / IMPORT ═══════════════ */
function exportData(){
  var nombre="finanzas-andres-"+today()+".json";
  var datos=JSON.stringify(D,null,2);
  // dentro del artifact el <a download> no funciona: hay que pedirlo al visor
  if(window.claude && window.claude.downloads){
    window.claude.downloads.save({filename:nombre,data:datos}).then(function(){
      toast("Respaldo guardado ✓");
    })["catch"](function(e){
      var c=e&&e.code;
      if(c==="declined") toast("Descarga cancelada");
      else if(c==="rate_limited") toast("Espera un momento e intenta de nuevo");
      else if(c==="too_large") toast("El respaldo es muy grande");
      else { copiarRespaldo(datos); }
    });
    return;
  }
  try{
    var blob=new Blob([datos],{type:"application/json"});
    var a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=nombre;
    document.body.appendChild(a); a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},400);
    toast("Respaldo descargado ✓");
  }catch(e){ copiarRespaldo(datos); }
}
// último recurso: al portapapeles, para que nunca se quede sin salida
function copiarRespaldo(datos){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(datos).then(function(){
      toast("Copiado al portapapeles ✓");
    })["catch"](function(){ toast("No se pudo exportar"); });
  } else toast("No se pudo exportar");
}
function importData(){
  var inp=document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.onchange=function(){
    var f=inp.files[0]; if(!f) return;
    var rd=new FileReader();
    rd.onload=function(){
      try{
        var d=JSON.parse(rd.result);
        if(!d.expenses||!d.income) throw 0;
        if(!confirm("Esto reemplaza todos los datos actuales. ¿Continuar?")) return;
        D=normalize(d); save(); go("resumen"); toast("Respaldo restaurado ✓");
      }catch(e){ toast("⚠ Archivo inválido"); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* "5-11" -> 6h, "8-2" -> 6h, "8:00-14:30" -> 6.5h.
   Sin am/pm, si la hora de fin es menor que la de inicio, se asume la tarde. */
function horasDeTurno(txt){
  if(!txt) return null;
  var t=String(txt).toLowerCase().replace(/\s+/g,"").replace(/[–—]/g,"-");
  var re=/^(\d{1,2})(?::(\d{2}))?(am|pm)?[-a](\d{1,2})(?::(\d{2}))?(am|pm)?$/;
  var m=t.match(re);
  if(!m) return null;
  var h1=+m[1], mi1=+(m[2]||0), p1=m[3];
  var h2=+m[4], mi2=+(m[5]||0), p2=m[6];
  if(h1>23||h2>23||mi1>59||mi2>59) return null;
  if(p1==="pm"&&h1<12) h1+=12;  if(p1==="am"&&h1===12) h1=0;
  if(p2==="pm"&&h2<12) h2+=12;  if(p2==="am"&&h2===12) h2=0;
  var ini=h1*60+mi1, fin=h2*60+mi2;
  if(p2){ if(fin<=ini) fin+=24*60; }
  else { while(fin<=ini){ fin+=12*60; if(fin-ini>16*60) return null; } }
  var horas=(fin-ini)/60;
  if(horas<=0||horas>16) return null;
  return Math.round(horas*100)/100;
}
function autoHoras(){
  var t=el("f-shift"), c=el("f-hours"), n=el("hint-horas");
  if(!t||!c) return;
  var h=horasDeTurno(t.value);
  if(h!=null){ c.value=h; if(n) n.textContent="Son "+h+" horas."; }
  else if(n) n.textContent = t.value.trim() ? "No pude leer ese horario — pon las horas a mano." : "";
}

function sincronizarPropina(h,monto){
  var lig=propinaLigada(h);
  if(monto>0){
    if(lig){ lig.amount=monto; lig.currency="USD"; lig.date=h.date; }
    else{
      var nuevo={id:uid(),date:h.date,source:"Propinas",amount:monto,currency:"USD"};
      D.income.push(nuevo); h.tipId=nuevo.id;
    }
  } else if(lig){
    D.income=D.income.filter(function(i){return i.id!==lig.id;});
    delete h.tipId;
  }
}

  if(id){ h=D.cafe_hours.filter(function(x){return x.id===id;})[0];
    h.hours=hh;h.date=dt;h.shift=sh; }
  else { h={id:uid(),date:dt,shift:sh,hours:hh}; D.cafe_hours.push(h); }
  sincronizarPropina(h,tips||0);
  save(); closeSheet(); refresh();
  toast(tips>0?"Turno y "+money(tips)+" en propinas ✓":"Turno guardado ✓");
}
function delRec(coll,id){
  if(!confirm("¿Eliminar este registro?")) return;
  if(coll==="cafe_hours"){
    var h=D.cafe_hours.filter(function(x){return x.id===id;})[0];
    if(h) sincronizarPropina(h,0);
  }
  D[coll]=D[coll].filter(function(x){return x.id!==id;});
  save(); closeSheet(); refresh(); toast("Eliminado");
}
